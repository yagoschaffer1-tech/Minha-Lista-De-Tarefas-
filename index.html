<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>📝 Minha Lista de Tarefas</h1>
            <p>Organize suas tarefas de forma simples</p>
        </header>

        <div class="form-tarefa">

            <input
                type="text"
                id="inputTarefa"
                placeholder="Digite uma nova tarefa..."
            >

            <button id="btnAdicionar">
                Adicionar
            </button>

        </div>

        <div class="informacoes">

            <span>
                Total: <strong id="totalTarefas">0</strong>
            </span>

            <span>
                Concluídas: <strong id="tarefasConcluidas">0</strong>
            </span>

            <span>
                Pendentes: <strong id="tarefasPendentes">0</strong>
            </span>

        </div>

        <ul id="listaTarefas"></ul>

        <div id="mensagemVazia" class="mensagem-vazia">
            Nenhuma tarefa cadastrada.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
